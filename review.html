<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Оставить отзыв | IronMebel</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <meta
      name="description"
      content="Оставьте отзыв о товаре в интернет-магазине IronMebel."
    />

    <link rel="stylesheet" href="./css/page-review.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/keen-slider@6.8.6/keen-slider.min.css"
    />
  </head>
  <body>
    <div class="page">
      <div data-layout-header></div>

      <main class="im-review-page">
        <div class="im-container">
          <!-- Хлебные крошки -->
          <nav
            class="im-review-page__breadcrumbs"
            aria-label="Хлебные крошки"
          >
            <a class="im-review-page__breadcrumb-link" href="./index.html"
              >Главная</a
            >
            <span class="im-review-page__breadcrumb-separator">/</span>
            <a class="im-review-page__breadcrumb-link" href="./catalog.html"
              >Металлические стеллажи</a
            >
            <span class="im-review-page__breadcrumb-separator">/</span>
            <a class="im-review-page__breadcrumb-link" href="#">Среднегрузовые</a>
            <span class="im-review-page__breadcrumb-separator">/</span>
            <a class="im-review-page__breadcrumb-link" href="./product.html"
              >Стеллаж металлический Optimus Pro h-2000 Zn, 3 яруса</a
            >
          </nav>

          <!-- Заголовок с изображением товара -->
          <div class="im-review-page__header">
            <div class="im-review-page__product-image-wrap">
              <img
                class="im-review-page__product-image"
                src="./images/catalogue/mock_catalogue_item.png"
                alt="Стеллаж металлический Optimus Pro h-2000 Zn, 3 яруса"
              />
            </div>
            <h1 class="im-review-page__title">
              Ваш отзыв о товаре «Стеллаж металлический Optimus Pro h-2000 Zn, 3 яруса»
            </h1>
          </div>

          <!-- Основной контент -->
          <div class="im-review-page__body">
            <!-- Форма отзыва -->
            <form class="im-review-page__form" data-review-form>
              <!-- Рейтинг -->
              <div class="im-review-page__rating" data-review-rating>
                <div class="im-review-page__stars" data-review-stars>
                  <button class="im-review-page__star" type="button" data-star="1" aria-label="1 звезда">
                    <svg class="im-review-page__star-empty" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#CCCCCC" />
                    </svg>
                    <svg class="im-review-page__star-filled" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#FF2E2E" />
                    </svg>
                  </button>
                  <button class="im-review-page__star" type="button" data-star="2" aria-label="2 звезды">

                    </svg>
                    <svg class="im-review-page__star-filled" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#FF2E2E" />
                    </svg>
                  </button>
                  <button class="im-review-page__star" type="button" data-star="3" aria-label="3 звезды">
                    <svg class="im-review-page__star-empty" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">

                    </svg>
                    <svg class="im-review-page__star-filled" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#FF2E2E" />
                    </svg>
                  </button>
                  <button class="im-review-page__star" type="button" data-star="4" aria-label="4 звезды">
                    <svg class="im-review-page__star-empty" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#CCCCCC" />
                    </svg>
                    <svg class="im-review-page__star-filled" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#FF2E2E" />
                    </svg>
                  </button>
                  <button class="im-review-page__star" type="button" data-star="5" aria-label="5 звёзд">
                    <svg class="im-review-page__star-empty" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#CCCCCC" />
                    </svg>
                    <svg class="im-review-page__star-filled" width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M16.6826 1.40685e-07C15.7311 -0.000333193 14.7594 0.591674 14.1839 1.77001L10.6441 9.05783L2.57542 10.203C-0.0194091 10.564 -0.860076 13.1097 1.01376 14.9397L6.84392 20.6147L5.49059 28.5797C5.04492 31.158 7.18343 32.7163 9.49893 31.4947C10.3936 31.0213 14.9938 28.638 16.6826 27.7463L23.8662 31.4947C26.1844 32.7163 28.3296 31.1597 27.8746 28.5797L26.4691 20.6147L32.2994 14.9397C34.1821 13.1163 33.3848 10.5713 30.7898 10.203L22.6691 9.05783L19.1813 1.77001C18.6066 0.591174 17.6341 0.000500141 16.6826 1.40685e-07Z" fill="#FF2E2E" />
                    </svg>
                  </button>
                </div>
                <span class="im-review-page__rating-hint">— Поставьте общую оценку товара</span>
                <input type="hidden" name="rating" value="0" data-review-rating-input />
              </div>

              <!-- Мнение о товаре -->
              <fieldset class="im-review-page__fieldset">
                <legend class="im-review-page__legend">Мнение о товаре</legend>

                <div class="im-review-page__field">
                  <textarea
                    class="im-review-page__textarea"
                    id="review-opinion"
                    name="opinion"
                    placeholder="Ваше мнение"
                    rows="4"
                    data-review-opinion
                  ></textarea>
                  <label class="im-review-page__field-label" for="review-opinion">Ваше мнение</label>
                </div>

                <div class="im-review-page__field">
                  <input
                    class="im-review-page__input"
                    id="review-pros"
                    name="pros"
                    type="text"
                    placeholder="Достоинства"
                    data-review-pros
                  />
                  <label class="im-review-page__field-label" for="review-pros">Достоинства</label>
                </div>

                <div class="im-review-page__field">
                  <input
                    class="im-review-page__input"
                    id="review-cons"
                    name="cons"
                    type="text"
                    placeholder="Недостатки"
                    data-review-cons
                  />
                  <label class="im-review-page__field-label" for="review-cons">Недостатки</label>
                </div>
              </fieldset>

              <!-- Загрузка фото -->
              <div class="im-review-page__upload-section" data-photo-upload>
                <div class="im-review-page__upload-previews-wrap" data-photo-previews-wrap>
                  <div class="im-review-page__upload-previews" data-photo-previews></div>
                  <button class="im-review-page__slider-arrow" type="button" aria-label="Следующее фото" data-photo-arrow>
                    <svg width="5" height="11" viewBox="0 0 5 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M0.895488 0.0184698C0.707989 -0.0197801 0.506239 -0.00328014 0.334489 0.11222C-0.00826 0.341719 -0.104259 0.821722 0.124491 1.16672L2.83348 5.24447L0.124491 9.32295C-0.104259 9.6672 -0.00826 10.148 0.334489 10.3775C0.677988 10.607 1.15649 10.5109 1.38524 10.1667L4.37472 5.66671C4.54197 5.41471 4.54197 5.07496 4.37472 4.82296L1.38524 0.322973C1.27124 0.150474 1.08299 0.0559697 0.895488 0.0184698Z" fill="#222222" />
                    </svg>
                  </button>
                </div>
                <label class="im-review-page__upload-area im-review-page__upload-area--photo" data-photo-drop>
                  <input
                    class="im-review-page__upload-input"
                    type="file"
                    name="photos"
                    accept="image/jpeg,image/png"
                    multiple
                    data-photo-input
                  />
                  <span class="im-review-page__upload-icon" aria-hidden="true">
                    <svg width="34" height="27" viewBox="0 0 34 27" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M6.66666 0C2.985 0 0 2.985 0 6.66667V20C0 20.92 0.183327 21.8067 0.519994 22.6034C0.863327 23.415 1.36167 24.13 1.98 24.74C2.57667 25.3283 3.27834 25.815 4.06334 26.1466C4.87167 26.4933 5.73 26.6667 6.66666 26.6667H26.6667C30.3483 26.6667 33.3333 23.6817 33.3333 20V6.66667C33.3333 2.985 30.3483 0 26.6667 0H6.66666ZM6.66666 3.33333H26.6667C28.5083 3.33333 30 4.825 30 6.66667L30.0017 16.265C26.6167 13.7366 24.1683 13.9333 20.365 16.1983C17.0216 11.63 13.8067 9.12333 10.6767 9.375C8.23667 9.57167 6.02 11.1167 3.35167 14.3867L3.33333 6.66667C3.33333 4.825 4.825 3.33333 6.66666 3.33333ZM25 6.66667C24.08 6.66667 23.3333 7.41333 23.3333 8.33333C23.3333 9.25333 24.08 10 25 10C25.92 10 26.6667 9.25333 26.6667 8.33333C26.6667 7.41333 25.92 6.66667 25 6.66667ZM10.8333 12.7083C13.2033 12.4817 15.5567 14.715 18.5933 19.27C19.105 20.0367 20.1717 20.25 20.9367 19.74C25.1 16.965 26.1517 16.9884 29.7916 20.52C29.785 20.56 29.7483 20.585 29.74 20.625C29.5883 21.3317 29.2883 21.9717 28.8017 22.4483C28.2167 22.9567 27.5033 23.3333 26.6667 23.3333H6.66666C5.81 23.3333 5.08832 22.995 4.53165 22.4483C3.97499 21.9017 3.58165 21.145 3.48999 20.3133C6.28665 15.5416 8.56833 12.925 10.8333 12.7083Z" fill="#999999" />
                    </svg>
                  </span>
                  <span class="im-review-page__upload-text">Нажмите сюда, чтобы загрузить фото</span>
                  <span class="im-review-page__upload-hint">
                    Вы можете загрузить до 15 фото формата jpg или jpeg. Максимальный размер файла – 10 Мб.
                  </span>
                </label>
              </div>

              <!-- Загрузка видео -->
              <div class="im-review-page__upload-section" data-video-upload>
                <div class="im-review-page__upload-previews-wrap" data-video-previews-wrap>
                  <div class="im-review-page__upload-previews" data-video-previews></div>
                  <button class="im-review-page__slider-arrow" type="button" aria-label="Следующее видео" data-video-arrow>
                    <svg width="5" height="11" viewBox="0 0 5 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M0.895488 0.0184698C0.707989 -0.0197801 0.506239 -0.00328014 0.334489 0.11222C-0.00826 0.341719 -0.104259 0.821722 0.124491 1.16672L2.83348 5.24447L0.124491 9.32295C-0.104259 9.6672 -0.00826 10.148 0.334489 10.3775C0.677988 10.607 1.15649 10.5109 1.38524 10.1667L4.37472 5.66671C4.54197 5.41471 4.54197 5.07496 4.37472 4.82296L1.38524 0.322973C1.27124 0.150474 1.08299 0.0559697 0.895488 0.0184698Z" fill="#222222" />
                    </svg>
                  </button>
                </div>
                <label class="im-review-page__upload-area im-review-page__upload-area--video" data-video-drop>
                  <input
                    class="im-review-page__upload-input"
                    type="file"
                    name="videos"
                    accept="video/mp4,video/quicktime"
                    multiple
                    data-video-input
                  />
                  <span class="im-review-page__upload-icon" aria-hidden="true">
                    <svg width="34" height="24" viewBox="0 0 34 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M6.66666 0C2.985 0 0 2.985 0 6.66667V16.6667C0 20.3483 2.985 23.3333 6.66666 23.3333H18.3333C22.015 23.3333 25 20.3483 25 16.6667V15.73L30.4683 21.1983C31.5183 22.2483 33.3333 21.485 33.3333 20V3.33333C33.3333 2.59167 32.8716 2.01169 32.2916 1.77002C31.7116 1.53002 30.9933 1.61001 30.4683 2.13501C29.785 2.81834 27.225 5.37835 25 7.60335V6.66667C25 2.985 22.015 0 18.3333 0H6.66666ZM6.66666 3.33333H18.3333C20.175 3.33333 21.6667 4.825 21.6667 6.66667V11.6667V16.6667C21.6667 18.5083 20.175 20 18.3333 20H6.66666C4.825 20 3.33333 18.5083 3.33333 16.6667V6.66667C3.33333 4.825 4.825 3.33333 6.66666 3.33333ZM30 7.39665V15.9367L25.73 11.6667C26.92 10.475 28.2616 9.13331 30 7.39665Z" fill="#999999" />
                    </svg>
                  </span>
                  <span class="im-review-page__upload-text">Нажмите сюда, чтобы загрузить видео</span>
                  <span class="im-review-page__upload-hint">
                    Вы можете загрузить три видео в формате .mp4 или .mov продолжительностью до 3 минут. Максимальный размер файла – 300 Мб.
                  </span>
                </label>
              </div>
            </form>

            <!-- Сайдбар -->
            <aside class="im-review-page__sidebar">
              <div class="im-review-page__consent">
                <label class="im-review-page__checkbox-label">
                  <input
                    class="im-review-page__checkbox"
                    type="checkbox"
                    name="consent"
                    checked
                    data-review-consent
                  />
                  <span class="im-review-page__checkbox-text">
                    Нажимая кнопку «Отправить отзыв», я соглашаюсь с
                    <a class="im-review-page__consent-link" href="#">условиями политики в отношении обработки персональных данных</a>
                  </span>
                </label>
              </div>
              <button
                class="im-review-page__submit"
                type="submit"
                form="review-form"
                data-review-submit
              >
                Отправить отзыв
              </button>
            </aside>
          </div>
        </div>
      </main>

      <div data-layout-footer></div>
    </div>

    <script src="./js/layout-include.js"></script>
    <script src="./js/review.js"></script>
  </body>
</html>
