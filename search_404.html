<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница не найдена | IronMebel</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <meta
      name="description"
      content="Страница не найдена. Перейдите в другие разделы IronMebel."
    />

    <link rel="stylesheet" href="./css/page-not-found.css" />
  </head>
  <body>
    <div class="page">
      <div data-layout-header></div>

      <main class="im-not-found-page">
        <div class="im-container">
          <section
            class="im-not-found-page__hero"
            aria-labelledby="not-found-title"
          >
            <div class="im-not-found-page__primary">
              <h1 class="im-not-found-page__title" id="not-found-title">
                <span class="im-not-found-page__title-label">ошибка</span>
                <span class="im-not-found-page__title-code">404</span>
              </h1>
              <p class="im-not-found-page__text">Такой страницы нет...</p>
            </div>

            <div class="im-not-found-page__secondary">
              <div class="im-not-found-page__secondary-inner">
                <h2 class="im-not-found-page__secondary-title">
                  Но есть много других полезных страниц
                </h2>

                <nav
                  class="im-not-found-page__links"
                  aria-label="Полезные страницы"
                >
                  <a class="im-not-found-page__link" href="#">Главная</a>
                  <a class="im-not-found-page__link" href="#"
                    >Готовые решения</a
                  >
                  <a class="im-not-found-page__link" href="#">Ironmebel PRO</a>
                  <a class="im-not-found-page__link" href="#">О компании</a>
                  <a class="im-not-found-page__link" href="#">Тест-драйв</a>
                </nav>
              </div>
            </div>
          </section>
        </div>
      </main>

      <div data-layout-footer></div>
    </div>

    <script src="./js/layout-include.js"></script>
  </body>
</html>
